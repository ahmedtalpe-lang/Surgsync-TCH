          background: conic-gradient(var(--c) calc(var(--p) * 1%), rgb(var(--card2)) 0); }

const Local = {
  P: 'ss:doc:',
  listeners: new Set(),
  read(path) { return readJSON(this.P + path); },
  write(path, data) {
    try { localStorage.setItem(this.P + path, JSON.stringify(data)); }
    catch (e) { throw Object.assign(new Error('Device storage is full — delete old photos or connect Cloud Sync.'), { code: 'quota' }); }
  },
  remove(path) { localStorage.removeItem(this.P + path); },
  list(col) {
    const pre = this.P + col + '/'; const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(pre) && !k.slice(pre.length).includes('/')) { const d = readJSON(k); if (d) out.push({ ...d, id: k.slice(pre.length) }); }
    }
    return out;
  },
  listen(col, where, cb) {
    const l = { col, fire: () => cb(this.list(col).filter((d) => !where || d[where[0]] === where[2]), { pending: false, cache: false }) };
    this.listeners.add(l); setTimeout(l.fire, 0);
    return () => this.listeners.delete(l);
  },
  listenDoc(path, cb) {
    const l = { doc: path, fire: () => { const d = this.read(path); cb(d ? { ...d, id: path.split('/').pop() } : null, { pending: false, cache: false }); } };
    this.listeners.add(l); setTimeout(l.fire, 0);
    return () => this.listeners.delete(l);
  },
  notify(path) {
    const col = path.split('/').slice(0, -1).join('/');
    this.listeners.forEach((l) => { if ((l.doc && l.doc === path) || (l.col && l.col === col)) l.fire(); });
  },
};
window.addEventListener('storage', (e) => { if (e.key && e.key.startsWith(Local.P)) Local.notify(e.key.slice(Local.P.length)); });

const isCloud = () => state.mode === 'firebase';
const Store = {
  listen(col, where, cb, onErr) {
    if (!isCloud()) return Local.listen(col, where, cb);
    const { F, db } = FB;
    let q = F.collection(db, col);
    if (where) q = F.query(q, F.where(where[0], where[1], where[2]));
    return F.onSnapshot(q, { includeMetadataChanges: true },
      (snap) => cb(snap.docs.map((d) => ({ ...d.data(), id: d.id })), { pending: snap.metadata.hasPendingWrites, cache: snap.metadata.fromCache }),
      (e) => { console.error('listen', col, e); onErr?.(e); });
  },
  listenDoc(path, cb, onErr) {
    if (!isCloud()) return Local.listenDoc(path, cb);
    return FB.F.onSnapshot(FB.F.doc(FB.db, path), { includeMetadataChanges: true },
      (s) => cb(s.exists() ? { ...s.data(), id: s.id } : null, { pending: s.metadata.hasPendingWrites, cache: s.metadata.fromCache }),
      (e) => { console.error('listenDoc', path, e); onErr?.(e); });
  },
  async get(path) {
    if (!isCloud()) { const d = Local.read(path); return d ? { ...d, id: path.split('/').pop() } : null; }
    const s = await FB.F.getDoc(FB.F.doc(FB.db, path));
    return s.exists() ? { ...s.data(), id: s.id } : null;
  },
  async getAll(col) {
    if (!isCloud()) return Local.list(col);
    const s = await FB.F.getDocs(FB.F.collection(FB.db, col));
    return s.docs.map((d) => ({ ...d.data(), id: d.id }));
  },
  async set(path, data, merge = true) {
    const clean = stripUndef(data); delete clean.id;
    if (!isCloud()) {
      const old = merge ? Local.read(path) || {} : {};
      Local.write(path, { ...old, ...clean }); queueMicrotask(() => Local.notify(path)); return;
    }
    return FB.F.setDoc(FB.F.doc(FB.db, path), clean, { merge });
  },
  async update(path, patch) {
    const clean = stripUndef(patch); delete clean.id;
    if (!isCloud()) {
      const old = Local.read(path);
      if (!old) throw Object.assign(new Error('Record not found'), { code: 'not-found' });
      Local.write(path, { ...old, ...clean }); queueMicrotask(() => Local.notify(path)); return;
    }
    return FB.F.updateDoc(FB.F.doc(FB.db, path), clean);
  },
  async del(path) {
    if (!isCloud()) { Local.remove(path); queueMicrotask(() => Local.notify(path)); return; }
    return FB.F.deleteDoc(FB.F.doc(FB.db, path));
  },
  async batch(ops) {
    if (!isCloud()) {
      for (const o of ops) {
        if (o.op === 'delete') await this.del(o.path);
        else if (o.op === 'update') await this.update(o.path, o.data);
        else await this.set(o.path, o.data, o.merge !== false);
      }
      return;
    }
    const b = FB.F.writeBatch(FB.db);
    ops.forEach((o) => {
      const r = FB.F.doc(FB.db, o.path);
      const d = o.data ? stripUndef(o.data) : null; if (d) delete d.id;
      if (o.op === 'delete') b.delete(r); else if (o.op === 'update') b.update(r, d); else b.set(r, d, { merge: o.merge !== false });
    });
    return b.commit();
  },
};

async function hashPass(email, pass) {
  const s = `surgsync:${email.toLowerCase()}:${pass}`;
  if (globalThis.crypto?.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return 'f' + (h >>> 0).toString(16);
}
const AuthSvc = {

    }
    this._localCb = () => cb(readJSON(LS.session));
    setTimeout(this._localCb, 0);
    window.addEventListener('storage', (e) => { if (e.key === LS.session) this._localCb(); });
    return () => {};
  },
  async signIn(email, pass) {
    if (isCloud()) return FB.A.signInWithEmailAndPassword(FB.auth, email, pass);
    const rec = readJSON('ss:auth:' + email.toLowerCase());
    if (!rec) throw authErr('auth/user-not-found');
    if (rec.hash !== await hashPass(email, pass)) throw authErr('auth/invalid-credential');
    this._setLocal({ uid: rec.uid, email, displayName: rec.name || '', photoURL: '', isAnonymous: false });
  },
  async register(email, pass, name) {

    if (readJSON(key)) throw authErr('auth/email-already-in-use');
    const uid = genId('u');
    writeJSON(key, { uid, hash: await hashPass(email, pass), name });

  async google() {

    const { A, auth } = FB;

  },
  async resetLocalPassword(email, newPass) {
    const key = 'ss:auth:' + email.toLowerCase(); const rec = readJSON(key);

  },
  async anon() {

  },
  async signOut() {
    if (isCloud()) return FB.A.signOut(FB.auth);

function toast(msg, type = 'ok', ms = 2600) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  const tone = type === 'err' ? 'bg-red-600 text-white' : type === 'warn' ? 'bg-amber-400 text-black' : 'bg-zinc-800 text-white dark:bg-zinc-100 dark:text-zinc-900';
  el.className = `pointer-events-auto max-w-sm w-full rounded-2xl px-4 py-3 text-sm font-medium shadow-2xl ${tone} toast-in`;
  el.textContent = msg;
  box.appendChild(el);

  if (type === 'err') haptic([20, 40, 20]);

function startDataListeners() {

    Store.listen('drugs', null, (docs, meta) => { state.drugs = docs; state.drugsMeta = meta; maybeSeed(); onLibChanged(); }, onErr),
    Store.listen('templates', null, (docs, meta) => { state.templates = docs; state.tplMeta = meta; maybeSeed(); onLibChanged(); }, onErr),
    Store.listenDoc('settings/unit_config', (d, meta) => { if (!d && meta?.cache) return; state.config = { passcode: '', customLabs: [], ...(d || {}) }; state.configMeta = meta; state.configLoaded = true; maybeSeed(); onLibChanged(); }, onErr),
    Store.listen('users', null, (docs) => { state.users = docs; if (state.view === 'admin') guardedRender('view', $('#view'), renderView); renderDrawer(); }, () => {}),
  );

function patchPatient(pid, patch, msg) {
  const p = getPatient(pid);
  if (!p) { toast('Record not found', 'err'); return Promise.resolve(); }
  const meta = { updatedAt: nowISO(), updatedBy: docName() };
  Object.assign(p, patch, meta); // optimistic local update
  rerenderPatient(pid);
  if (msg) toast(msg);
  return Store.update('patients/' + pid, { ...patch, ...meta }).catch((e) => { console.error(e); toast('Sync failed: ' + errMsg(e), 'err', 5000); });
}
function rerenderPatient(pid) {
  if (state.screen !== 'app') return;
  refreshHeader(); renderView(); renderDrawer();
  if (state.openPid === pid) renderSheet();
  refreshModals();
}

  mediaUnsub?.();

}

// --- Pointer-based drag & drop (mouse + touch) for checklist reordering ---
let drag = null;
const clearDropMarks = () => $$('.drop-before,.drop-after,.drop-zone').forEach((x) => x.classList.remove('drop-before', 'drop-after', 'drop-zone'));
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest?.('[data-drag-handle]'); if (!h) return;
  const item = h.closest('[data-cl-item]'); if (!item || !state.openPid) return;
  e.preventDefault();
  drag = { id: item.dataset.id, item, startY: e.clientY, target: null, after: false };
  item.classList.add('dragging'); haptic(10);
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  e.preventDefault();
  drag.item.style.transform = `translateY(${e.clientY - drag.startY}px)`;
  clearDropMarks();
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tItem = under?.closest?.('[data-cl-item]');
  const zone = under?.closest?.('[data-cl-stage]');
  if (tItem && tItem !== drag.item) {
    const r = tItem.getBoundingClientRect();
    drag.after = e.clientY > r.top + r.height / 2;
    drag.target = { type: 'item', id: tItem.dataset.id, stage: tItem.dataset.stage };
    tItem.classList.add(drag.after ? 'drop-after' : 'drop-before');
  } else if (zone) { drag.target = { type: 'stage', stage: zone.dataset.clStage }; zone.classList.add('drop-zone'); }
  else drag.target = null;
  const body = $('#sheet-body');
  if (body) { const r = body.getBoundingClientRect(); if (e.clientY < r.top + 70) body.scrollTop -= 14; else if (e.clientY > r.bottom - 70) body.scrollTop += 14; }
}, { passive: false });
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  d.item.classList.remove('dragging'); d.item.style.transform = '';
  clearDropMarks();
  if (d.target && state.openPid) applyDrop(state.openPid, d.id, d.target, d.after);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
function applyDrop(pid, id, target, after) {
  const p = getPatient(pid); if (!p) return;
  const list = clone(p.checklist); const it = list.find((c) => c.id === id); if (!it) return;
  if (target.type === 'item' && target.id === id) return;
  if (it.stage !== target.stage) clSetStage(it, target.stage);
  const others = list.filter((c) => c.stage === target.stage && c.id !== id).sort(byOrder);
  let idx = others.length;
  if (target.type === 'item') { const ti = others.findIndex((c) => c.id === target.id); if (ti >= 0) idx = after ? ti + 1 : ti; }
  others.splice(idx, 0, it);
  others.forEach((c, i) => { c.order = i; });
  haptic(8); patchPatient(pid, { checklist: list });
}

function parseConfigText(txt) {
  const m = String(txt || '').match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No { … } config object found');
  const s = m[0].replace(/^\s*\/\/.*$/gm, '').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const cfg = JSON.parse(s);
  if (!cfg.apiKey || !cfg.projectId) throw new Error('Config must include apiKey and projectId');
  return cfg;
}

  },
};
const SW_SOURCE = String.raw`/* Unit D — SurgSync service worker: cache-first app shell + offline fallback */
const CACHE = 'surgsync-v1.0.0';
const SHELL = ['./', './index.html', './manifest.json'];
const BYPASS = ['firestore.googleapis.com', 'identitytoolkit.googleapis.com', 'securetoken.googleapis.com', 'firebaseinstallations.googleapis.com', 'apis.google.com', 'accounts.google.com', 'api.github.com', 'firebaseapp.com', 'google-analytics.com', '/__/auth/'];

self.addEventListener('install', (event) => {
  event.waitUntil(caches.open(CACHE).then((c) => c.addAll(SHELL)).catch(() => null).then(() => self.skipWaiting()));
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys()
      .then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});

self.addEventListener('message', (event) => {
  if (event.data === 'SKIP_WAITING') self.skipWaiting();
});

self.addEventListener('fetch', (event) => {
  const req = event.request;
  if (req.method !== 'GET') return;
